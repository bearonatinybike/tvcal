services:
  tvcal:
    build: .
    image: tvcal:latest
    container_name: tvcal
    restart: unless-stopped
    # Run as you, not root, so the database stays yours.
    user: "${TVCAL_UID:-1000}:${TVCAL_GID:-1000}"
    ports:
      - "127.0.0.1:8087:8087"
    environment:
      TZ: Europe/London
      TVCAL_REFRESH_HOURS: "12"
    volumes:
      - ./data:/data
