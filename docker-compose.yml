services:
  tvcal:
    build: .
    image: tvcal:latest
    container_name: tvcal
    restart: unless-stopped
    # Run as you, not root, so the content list and database stay yours.
    user: "${TVCAL_UID:-1000}:${TVCAL_GID:-1000}"
    ports:
      - "127.0.0.1:8087:8087"
    environment:
      TZ: Europe/London
      TVCAL_REFRESH_HOURS: "12"
      TVCAL_CONTENT_LIST: /hostdata/.content_list.json
      TVCAL_CONTENT_LIST_SYNC: "1"
    volumes:
      - ./data:/data
      # Directory, not the single file: an atomic replace swaps the inode and
      # a single-file bind mount would stop tracking it after the first write.
      - ${TVCAL_CONTENT_DIR:-${HOME}}:/hostdata
